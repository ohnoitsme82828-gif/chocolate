<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dark Chocolate</title>

<style>
/* ===== GLOBAL ===== */
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(#0c0603, #030101);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, sans-serif;
}

/* ===== SCENE ===== */
#scene {
  width: 260px;
  height: 380px;
  position: relative;
}

/* ===== WRAPPER ===== */
#wrapper {
  position: absolute;
  inset: 0;
  border-radius: 22px;
  background:
    linear-gradient(135deg, #3a0f5c, #1e0633 45%, #12001f),
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.06) 0px,
      rgba(255,255,255,0.06) 2px,
      transparent 4px
    );
  box-shadow:
    inset 0 8px 14px rgba(255,255,255,0.18),
    inset 0 -14px 24px rgba(0,0,0,0.7),
    0 30px 50px rgba(0,0,0,0.8);
  z-index: 3;
  cursor: pointer;
  transition: transform 0.8s ease;
}

/* foil texture overlay */
#wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-radial-gradient(
      circle,
      rgba(255,255,255,0.12) 0px,
      rgba(255,255,255,0.12) 1px,
      transparent 2px
    );
  opacity: 0.35;
  mix-blend-mode: overlay;
  pointer-events: none;
}

/* ===== CHOCOLATE ===== */
#chocolate {
  position: absolute;
  inset: 0;
  border-radius: 22px;
  overflow: hidden;
  background:
    linear-gradient(180deg, #2a140a 0%, #1b0c06 55%, #120703 100%);
  box-shadow:
    inset 0 8px 14px rgba(255,255,255,0.08),
    inset 0 -14px 24px rgba(0,0,0,0.7),
    0 25px 45px rgba(0,0,0,0.8);
  z-index: 1;
}

/* chocolate texture */
#chocolate::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-radial-gradient(
      circle,
      rgba(0,0,0,0.06) 0px,
      rgba(0,0,0,0.06) 1px,
      transparent 2px
    );
  opacity: 0.7;
  mix-blend-mode: multiply;
  pointer-events: none;
}

/* ===== EAT MASK ===== */
#eatMask {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: #030101;
  z-index: 2;
  transition: height 0.25s ease;
}

/* ===== HINT ===== */
#hint {
  position: absolute;
  bottom: -32px;
  width: 100%;
  text-align: center;
  color: #caa36a;
  font-size: 14px;
  opacity: 0.9;
}
</style>
</head>

<body>

<div id="scene">
  <div id="wrapper"></div>
  <div id="chocolate">
    <div id="eatMask"></div>
  </div>
  <div id="hint">Tap to unwrap</div>
</div>

<script>
const wrapper = document.getElementById("wrapper");
const eatMask = document.getElementById("eatMask");
const hint = document.getElementById("hint");

let unwrapped = false;
let eaten = 0;
const BITE_SIZE = 12; // % per bite

function vibrate(ms = 40) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

wrapper.addEventListener("click", () => {
  if (unwrapped) return;
  wrapper.style.transform = "translateY(420px)";
  unwrapped = true;
  hint.textContent = "Tap to eat";
  vibrate(80);
});

document.getElementById("scene").addEventListener("click", () => {
  if (!unwrapped) return;
  if (eaten >= 100) {
    hint.textContent = "Finished 😋";
    vibrate(120);
    return;
  }
  eaten += BITE_SIZE;
  eatMask.style.height = eaten + "%";
  vibrate(35);
});
</script>

</body>
</html>
